name: EventMap feed

# Fetches Forex Factory from GitHub's IPs, commits the normalized feed, and
# pushes it so the local copy can be picked up with a single curl.
#
# TradingView rows were dropped (owner's choice). Investing.com cannot be
# fetched here or anywhere: Cloudflare bot-management 403s every non-browser
# client even from residential IPs. It is fetched LOCALLY by
# fetch_investing.py (Playwright headless Chromium) and merged into the
# final events.csv by pickup_feed.ps1 + merge_feed.py.
#
#   --out feed/events.csv      artifacts land in the repo itself

on:
  schedule:
    - cron: "*/20 * * * *"     # every 20 min; FF rate-limits tighter cadences
  workflow_dispatch: {}        # allow a manual run to test/refresh

concurrency:
  group: eventmap-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch providers
        run: |
          python fetch_events.py --provider ff \
            --days-back 2 --days-forward 8 \
            --out feed/events.csv

      - name: Commit and push feed
        run: |
          git config user.name  "eventmap-bot"
          git config user.email "eventmap-bot@users.noreply.github.com"
          git add feed/events.csv
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "feed $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
